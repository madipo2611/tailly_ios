name: Tailly
options:
  bundleIdPrefix: ru.tailly
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: '' # Set as GitHub secret/xcconfig before signing archives.
targets:
  Tailly:
    type: application
    platform: iOS
    sources: [Tailly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tailly.ios
        INFOPLIST_FILE: Tailly/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
  TaillyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TaillyTests]
    dependencies: [{target: Tailly}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tailly.ios.tests
